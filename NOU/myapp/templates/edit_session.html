{% extends 'superadmin/base.html' %}

{% block admin %}

<style>
    .edit-container {
        max-width: 900px;
        margin: 20px auto;
    }

    .page-title {
        color: #8b0d1f;
        font-weight: 700;
        margin-bottom: 5px;
    }

    .page-subtitle {
        color: #777;
        margin-bottom: 25px;
    }

    .edit-card {
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .form-label {
        font-weight: 600;
        color: #333;
    }

    .form-control,
    .form-select {
        height: 45px;
        border-radius: 7px;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: #a30d25;
        box-shadow: 0 0 0 0.2rem rgba(163, 13, 37, 0.15);
    }

    .btn-update {
        background: #9d1028;
        color: white;
        border: none;
        padding: 11px 25px;
        border-radius: 7px;
        font-weight: 600;
    }

    .btn-update:hover {
        background: #7f0c20;
        color: white;
    }

    .btn-cancel {
        background: #6c757d;
        color: white;
        padding: 11px 25px;
        border-radius: 7px;
        text-decoration: none;
        margin-left: 10px;
    }

    .btn-cancel:hover {
        background: #555;
        color: white;
    }

    .top-banner {
        background: linear-gradient(135deg, #8b0d1f, #c21f3a);
        color: white;
        border-radius: 12px;
        padding: 25px;
        margin-bottom: 25px;
    }

    .top-banner h2 {
        margin: 0;
        font-weight: 700;
    }

    .top-banner p {
        margin: 5px 0 0;
        opacity: 0.9;
    }
</style>


<div class="edit-container">

    <!-- Page Heading -->
    <h2 class="page-title">Edit Session</h2>
    <p class="page-subtitle">
        Update academic session information
    </p>


    <!-- Banner -->
    <div class="top-banner">
        <h2>Academic Session</h2>
        <p>Edit the selected session details</p>
    </div>


    <!-- Form Card -->
    <div class="edit-card">

        <form method="POST">

            {% csrf_token %}

            <!-- Session Name -->
            <div class="mb-3">
                <label class="form-label">
                    Session Name
                </label>

                <input
                    type="text"
                    name="session_name"
                    class="form-control"
                    value="{{ session.session_name }}"
                    required
                >
            </div>


            <!-- Status -->
            <div class="mb-3">
                <label class="form-label">
                    Status
                </label>

              
               <input type="text" placeholder="enter status" name="status" />
            </div>


            <!-- Start Date -->
            <div class="mb-3">
                <label class="form-label">
                    Start Date
                </label>

                <input
                    type="date"
                    name="strt_date"
                    class="form-control"
                    value="{{ session.strt_date|date:'Y-m-d' }}"
                    required
                >
            </div>


            <!-- End Date -->
            <div class="mb-3">
                <label class="form-label">
                    End Date
                </label>

                <input
                    type="date"
                    name="end_date"
                    class="form-control"
                    value="{{ session.end_date|date:'Y-m-d' }}"
                    required
                >
            </div>


            <!-- Buttons -->
            <div class="mt-4">

                <button
                    type="submit"
                    class="btn-update">
                    Update Session
                </button>

                <a
                    href="{% url 'show_session' %}"
                    class="btn-cancel">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
