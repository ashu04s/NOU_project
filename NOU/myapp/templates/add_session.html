<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Session</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        #a {
            min-height: 140px;
            width: 100%;
            background-color: wheat;

            display: flex;
            justify-content: space-between;
            align-items: center;

            border: 1px solid black;
            padding: 20px 40px;
        }

        #a h1 {
            font-weight: 600;
        }

        #a p {
            margin-top: 5px;
        }

        button {
            font-size: 18px;
            padding: 10px 18px;
            color: red;
            background-color: black;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            margin-left: 10px;
        }

        form {
            width: 80%;
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;

            background-color: white;
            border: 1px solid #ddd;
            border-radius: 15px;
        }

        h2 {
            margin-bottom: 25px;
        }

        .row {
            display: flex;
            gap: 25px;
            margin-bottom: 20px;
        }

        .form-group {
            width: 50%;
        }

        label {
            display: block;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            font-size: 16px;

            border: 1px solid #ccc;
            border-radius: 10px;

            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #c43d1d;
        }

        .save-btn {
            margin-left: 0;
            margin-top: 10px;

            color: white;
            background-color: #c43d1d;

            border-radius: 8px;
            padding: 12px 25px;
        }

        .message {
            width: 80%;
            max-width: 900px;
            margin: 20px auto;
            padding: 15px;

            background-color: #d4edda;
            color: #155724;

            border-radius: 8px;
        }

        @media (max-width: 700px) {

            .row {
                flex-direction: column;
            }

            .form-group {
                width: 100%;
            }

            form {
                width: 95%;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->

    <div id="a">

        <div>
            <h1>Add Session</h1>
            <p>NOU E-Gyan Portal</p>
        </div>

        <div>
            <button type="button">Superadmin</button>
            <button type="button">Login</button>
        </div>

    </div>


    <!-- Django Messages -->

    {% for message in messages %}

        <div class="message">
            {{ message }}
        </div>

    {% endfor %}


    <!-- Session Form -->

    <form method="post">

        {% csrf_token %}

        <h2>Session Information</h2>


        <!-- Session Name + Status -->

        <div class="row">

            <div class="form-group">

                <label for="session_name">
                    Session Name
                </label>

                <input
                    type="text"
                    id="session_name"
                    name="session_name"
                    placeholder="Enter session name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <input
                    type="text"
                    id="status"
                    name="status"
                    placeholder="Enter status"
                    required
                >

            </div>

        </div>


        <!-- Start Date + End Date -->

        <div class="row">

            <div class="form-group">

                <label for="strt_date">
                    Start Date
                </label>

                <input
                    type="date"
                    id="strt_date"
                    name="strt_date"
                    required
                >

            </div>


            <div class="form-group">

                <label for="end_date">
                    End Date
                </label>

                <input
                    type="date"
                    id="end_date"
                    name="end_date"
                    required
                >

            </div>

        </div>


        <!-- Save Button -->

        <button
            type="submit"
            class="save-btn"
        >
            Save Session
        </button>

    </form>

</body>

</html>
